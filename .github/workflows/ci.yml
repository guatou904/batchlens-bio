name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.5'
      - run: uv sync --locked --no-editable --python ${{ matrix.python }}
      - run: uv run --no-editable ruff check .
      - run: uv run --no-editable ruff format --check src tests scripts examples packaging
      - run: uv run --no-editable mypy
      - run: uv run --no-editable pytest --junitxml=artifacts/tests.xml
      - run: uv run --no-editable python -m build
      - run: uv run --no-editable twine check dist/*.whl dist/*.tar.gz
      - name: Install built artifacts outside the checkout
        run: uv run --no-editable python scripts/package_smoke.py --dist dist --out "$RUNNER_TEMP/batchlens-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/tests.xml
            ${{ runner.temp }}/batchlens-smoke/smoke-results.json
  scientific-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.5'
      - run: uv sync --locked --no-editable --python 3.12
      - run: Rscript --version
      - run: uv run --no-editable pytest tests/test_science.py -k independent_r -v
