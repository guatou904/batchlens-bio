[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "batchlens-bio"
version = "0.3.0"
description = "Experimental-design and batch-confounding audits for single-cell and spatial metadata"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "BatchLens contributors"}]
keywords = ["single-cell", "spatial-transcriptomics", "experimental-design", "confounding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7", "Jinja2>=3.1.5,<4",
]

[project.urls]
Repository = "https://github.com/guatou904/batchlens-bio"
Issues = "https://github.com/guatou904/batchlens-bio/issues"
Documentation = "https://github.com/guatou904/batchlens-bio#readme"
Changelog = "https://github.com/guatou904/batchlens-bio/blob/main/CHANGELOG.md"

[project.scripts]
batchlens = "batchlens.cli:main"

[project.gui-scripts]
batchlens-bio = "batchlens.desktop:main"

[project.optional-dependencies]
desktop = ["pywebview>=6.0,<7"]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1",
  "mypy>=1.15,<2", "pandas-stubs", "types-PyYAML",
  "build>=1.2,<2", "twine>=6,<7",
]
desktop-build = ["pyinstaller>=6.16,<7", "pillow>=11,<13"]

browser = ["playwright>=1.50,<2", "pillow>=11,<13"]

[tool.hatch.build.targets.wheel]
packages = ["src/batchlens"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "docs", "examples", "scripts", "packaging", "*.md", "LICENSE", "CITATION.cff", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "README.md"}, {file = "src/**/*.py"}, {file = "src/batchlens/resources/**/*"}]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/batchlens"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true
