<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BatchLens Bio · 研究设计工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23173330'/%3E%3Cpath d='M11 28V17M20 28V9M29 28V21' stroke='%23d7edac' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="app.css" />
    <script src="copy.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="skip">跳到主要内容</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="BatchLens Bio"
        ><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span
        ><span>BatchLens <b>Bio</b></span></a
      >
      <div class="header-tools">
        <span class="local"
          ><i aria-hidden="true"></i
          ><span data-i18n="local">本机处理</span></span
        ><button id="language" class="quiet" aria-label="Switch to English">
          EN</button
        ><button id="quit" class="quiet" data-i18n="quit">退出</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="hero">
        <div>
          <p class="eyebrow">EVIDENCE BEFORE INTERPRETATION</p>
          <h1 data-i18n="hero">先确认设计，<br />再推进分析。</h1>
          <p class="lead" data-i18n="lead">
            从一张细胞表开始，或声明完整的研究设计。<br />明确生物学重复、批次分配，以及你想做的比较。
          </p>
        </div>
        <aside class="hero-aside">
          <div class="design-art" aria-hidden="true">
            <div><i></i><i></i><i></i><i></i></div>
            <div><i></i><i></i><i></i><i></i></div>
            <div><i></i><i></i><i></i><i></i></div>
          </div>
          <strong data-i18n="oneEngine">两种入口，同一检查引擎</strong>
          <p data-i18n="privacy">无需账户 · 不上传云端</p>
          <small id="version">BatchLens Bio</small>
        </aside>
      </div>
      <div
        id="mode-tabs"
        class="mode-tabs"
        role="tablist"
        aria-label="工作方式"
      ></div>
      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
        tabindex="-1"
        hidden
      ></div>
      <div id="workspace" class="workspace">
        <section
          id="input-panel"
          tabindex="-1"
          class="card input-card"
          role="tabpanel"
          aria-labelledby="mode-quick"
        ></section>
        <aside class="side-column" id="guide-panel"></aside>
      </div>
      <section
        id="results"
        class="results"
        aria-labelledby="results-title"
        tabindex="-1"
        hidden
      ></section>
      <footer>
        <span
          >BatchLens Bio <span class="footer-slash">/</span> Thoughtful science,
          clearer design.</span
        ><span data-i18n="footer">可追溯证据 · 离线报告 · 合成示例</span>
      </footer>
    </main>
    <div id="busy" class="busy" role="status" aria-live="polite" hidden>
      <div>
        <span class="spinner" aria-hidden="true"></span>
        <h2 data-i18n="working">正在本机处理</h2>
        <p data-i18n="wait">请稍候，完成后会显示结果。</p>
      </div>
    </div>
  </body>
</html>
